[package]
name = "epub-reader"
version = "0.1.0"
description = "A beautiful, easy-to-use EPUB reader"
authors = ["HadiAbu"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "epub_reader_lib"
# Desktop-only for now. The GNU Windows toolchain cannot link Tauri as a DLL ("export ordinal
# too large"), and the desktop binary only needs the rlib. Restore "staticlib" and "cdylib"
# before `pnpm tauri android init` / iOS (see docs/android.md).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only plugins (they do not exist on Android/iOS).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# Thin LTO and a few codegen units keep release builds within the memory of an ordinary laptop
# (fat LTO with one unit needs several GB). The binary is only slightly larger.
codegen-units = 4
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
